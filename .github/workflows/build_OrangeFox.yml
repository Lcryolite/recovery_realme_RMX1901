name: Build-RMX1901-OrangeFox-recovery
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # This is the A17 ReSukiSU kernel that was validated on RMX1901.
      # Keep recovery builds reproducible: update the file and this digest
      # together only after a successful device boot test.
      RECOVERY_KERNEL_SHA256: 65cb52b47208616b4d56ac49db3687ec0c0616e7e6554d777fc47792138135f1
   
    steps:
    - name: "Cleanup Environment"
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 11
        
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt install git aria2 python2 ccache curl xz-utils zip -y
        git clone https://gitlab.com/OrangeFox/misc/scripts --depth=1
        cd scripts       
        sudo bash setup/android_build_env.sh
        cd -
        mkdir OrangeFox_sync
        cd OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git --depth=1
        cd sync/
        ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/fox_12.1 
    
    - name: Checkout Device Tree
      uses: actions/checkout@v4.1.1
      with:
        path: fox_12.1/device/realme/RMX1901

    - name: Validate pinned recovery inputs
      run: |
        python3 fox_12.1/device/realme/RMX1901/tools/recovery_image_guard.py kernel \
          fox_12.1/device/realme/RMX1901/prebuilt/Image.gz-dtb \
          --expected-sha256 "${RECOVERY_KERNEL_SHA256}"
    
    - name: Build recovery
      run: |
        cd fox_12.1
        source build/envsetup.sh || true
        lunch twrp_RMX1901-eng
        mka adbd recoveryimage -j2

    - name: Verify recovery image payloads
      run: |
        python3 fox_12.1/device/realme/RMX1901/tools/recovery_image_guard.py image \
          fox_12.1/out/target/product/RMX1901/recovery.img \
          --kernel fox_12.1/device/realme/RMX1901/prebuilt/Image.gz-dtb \
          --dtbo fox_12.1/device/realme/RMX1901/prebuilt/dtbo.img \
          --partition-size 67108864
        avbtool verify_image \
          --image fox_12.1/out/target/product/RMX1901/recovery.img \
          --key fox_12.1/external/avb/test/data/testkey_rsa4096.pem

    - name: Upload recovery
      uses: actions/upload-artifact@v4.3.0
      with:
        name: RMX1901-OFOX-RUI1-RUI2-UNZIP
        path: |
          fox_12.1/out/target/product/*/Orange*.zip
      
 
